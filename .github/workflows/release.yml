name: release
# Tag push (vX.Y) releases that tag; a push to main or a manual run publishes 1.0.<run number>.
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: scripts/make-app.sh "$VERSION"
      - run: gh release create "v$VERSION" build/MarkdownViewer-*.zip --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
