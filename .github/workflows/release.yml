name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-app.sh "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" build/MarkdownViewer-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
